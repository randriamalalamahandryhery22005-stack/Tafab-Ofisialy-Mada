<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1877f2">
  <meta name="description" content="Tafaß — réseau social">
  <title>Tafaß</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="brand-mark">T</div>
    <div class="brand-name">Tafaß</div>
    <div class="loading"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark small">T</span><b>Tafaß</b></div>
      <p class="muted">Connectez-vous à votre réseau.</p>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="E-mail" required>
        <input id="loginPassword" type="password" placeholder="Mot de passe" required>
        <button class="primary" type="submit">Se connecter</button>
      </form>
      <button id="showSignup" class="link-button">Créer un nouveau compte</button>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </section>

  <section id="signup" class="auth hidden">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark small">T</span><b>Créer votre compte</b></div>
      <form id="signupForm">
        <div class="grid2">
          <input id="firstName" placeholder="Prénom" required>
          <input id="lastName" placeholder="Nom" required>
        </div>
        <input id="signupEmail" type="email" placeholder="E-mail" required>
        <input id="signupPassword" type="password" minlength="6" placeholder="Mot de passe (6 caractères min.)" required>
        <input id="username" placeholder="@pseudo (optionnel)">
        <button class="primary" type="submit">Créer mon compte</button>
      </form>
      <button id="showLogin" class="link-button">J'ai déjà un compte</button>
      <div id="signupMsg" class="auth-msg"></div>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="top-left">
        <button class="logo-btn" data-route="home"><span class="brand-mark mini">T</span><span class="logo-text">Tafaß</span></button>
        <div class="searchbox"><span>⌕</span><input id="globalSearch" placeholder="Rechercher sur Tafaß"></div>
      </div>
      <nav class="topnav">
        <button data-route="home">⌂<span>Actualités</span></button>
        <button data-route="friends">♙<span>Amis</span></button>
        <button data-route="messages">▣<span>Messages</span><b id="msgBadge" class="badge hidden">0</b></button>
        <button data-route="videos">▶<span>Vidéos</span></button>
        <button data-route="reels">◉<span>Reels</span></button>
      </nav>
      <div class="top-actions">
        <button data-route="notifications" class="icon-btn">♢<b id="notifBadge" class="badge hidden">0</b></button>
        <button id="themeBtn" class="icon-btn" title="Mode sombre">☾</button>
        <button data-route="menu" class="icon-btn">☰</button>
        <button data-route="profile" id="avatarBtn" class="avatar avatar-sm">T</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar left-sidebar">
        <button data-route="profile" class="side-profile"><span id="sideAvatar" class="avatar">T</span><b id="sideName">Mon profil</b></button>
        <button data-route="home">⌂ <span>Actualités</span></button>
        <button data-route="friends">♙ <span>Amis</span></button>
        <button data-route="messages">▣ <span>Messages</span></button>
        <button data-route="notifications">♢ <span>Notifications</span></button>
        <button data-route="pages">▣ <span>Pages</span></button>
        <button data-route="groups">◎ <span>Groupes</span></button>
        <button data-route="videos">▶ <span>Vidéos</span></button>
        <button data-route="reels">◉ <span>Reels</span></button>
        <button data-route="saved">🔖 <span>Enregistrements</span></button>
        <button data-route="menu">☰ <span>Menu</span></button>
      </aside>

      <section id="content" class="content"></section>

      <aside class="sidebar right-sidebar">
        <div class="card">
          <div class="card-title"><b>Suggestions</b><button class="text-btn" data-route="friends">Voir tout</button></div>
          <div id="suggestions"></div>
        </div>
        <div class="card">
          <div class="card-title"><b>À propos de Tafaß</b></div>
          <p class="muted">Publiez, échangez et construisez votre communauté.</p>
          <small>© 2026 Tafaß</small>
        </div>
      </aside>
    </main>

    <nav class="bottomnav">
      <button data-route="home">⌂<small>Actualités</small></button>
      <button data-route="friends">♙<small>Amis</small></button>
      <button data-route="messages">▣<small>Messages</small></button>
      <button data-route="notifications">♢<small>Alertes</small></button>
      <button data-route="menu">☰<small>Menu</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
